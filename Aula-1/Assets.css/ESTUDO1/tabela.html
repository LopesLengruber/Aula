<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf8">
        <title>Aula tabelas</title>
    </head>

    <body>
        <table border="1">

        <thead>
            <td>#</td>
            <td>Primeiro</td>
            <td>Segunda</td>
        </thead>

        <tbody>
        <tr> 
            <td>1</td>
            <td>joão</td>
            <td>Mariano</td>
        </tr>

        <tr>
            <td>2</td>
            <td>Marcio</td>
            <td>Rafael</td>
        </tr>
        </tbody>

            <tfoot>
                <td>#</td>
                <td>Primeiro</td>
                <td>Segundo</td>
            </tfoot>

        </table>

    </body>

</html>
