<!DOCTYPE html>
<html lang="pt-br">
    <head>
      <meta charset="utf-8"/>
      <meta charset="Viewport" content="width=device-width, inial-scale=1.0"/>
      <title>Responsivo</title>
      <style>
        body {
          background: red;
          color: #fff;
          font-size: 30px;
        }

        p {
          display: none;
        }

        @media ( max-width: 500px) {
          body {

          p{

          }

      </style>
    </head>

      Texto 1

      <p>

      </p>
